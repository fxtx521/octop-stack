<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Octop 企业AI工作台</title>
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<!-- 登录页 -->
<div id="login" class="page">
  <div class="login-card">
    <div class="logo">Octop</div>
    <div class="sub">企业 AI 工作台 · 员工客户端</div>
    <input id="srv" value="http://127.0.0.1:8099" placeholder="服务器地址">
    <input id="user" placeholder="账号" autocomplete="off">
    <input id="pass" type="password" placeholder="密码">
    <button id="btnLogin" onclick="doLogin()">登 录</button>
    <div id="loginErr" class="err"></div>
  </div>
</div>
<!-- 主界面 -->
<div id="main" class="page hidden">
  <div class="topbar">
    <span class="brand">Octop 工作台</span>
    <span id="expertName" class="muted"></span>
    <span id="usage" class="muted bill"></span>
    <span class="spacer"></span>
    <button class="ghost" onclick="pickWS()">📁 项目目录</button>
    <span id="wsName" class="muted"></span>
  </div>
  <div class="body">
    <div id="chat" class="chat"></div>
    <div class="side">
      <div class="side-title">项目文件</div>
      <div id="files" class="files muted">未选择目录</div>
    </div>
  </div>
  <div class="inputbar">
    <input id="msg" placeholder="输入消息, 回车发送" onkeydown="if(event.key==='Enter')send()">
    <button onclick="send()">发送</button>
  </div>
</div>
<script src="./src/main.js" type="module"></script>
</body>
</html>
