name: Build Desktop Client

# 三平台自动打包: 打 tag 或手动触发
# 产物: macOS .app(zip) / Windows exe+安装包 / 全部上传到 Release 与 Artifacts
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
          - os: windows-latest
            platform: windows/amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        run: wails build -platform darwin/universal -zip

      - name: Build (Windows, 含NSIS安装包)
        if: matrix.os == 'windows-latest'
        run: wails build -platform windows/amd64 -nsis

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: octop-workbench-${{ matrix.os }}
          path: |
            client-gui/build/bin/*.zip
            client-gui/build/bin/*.exe
            client-gui/build/bin/*.app

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            client-gui/build/bin/*.zip
            client-gui/build/bin/*installer*.exe
