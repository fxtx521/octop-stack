name: Build Desktop Client

# 三平台自动打包: 打 tag 或手动触发
# 产物: macOS .app(zip) / Windows exe+安装包 / 全部上传到 Release 与 Artifacts
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
          - os: windows-latest
            platform: windows/amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0

      - name: Build (macOS) + zip
        if: matrix.os == 'macos-latest'
        working-directory: client-gui
        run: |
          wails build -platform darwin/universal
          cd build/bin
          ditto -c -k --sequesterRsrc --keepParent octop-workbench.app octop-workbench-mac.zip
          hdiutil create -volname "Octop Workbench" -srcfolder octop-workbench.app -ov -format UDZO octop-workbench-mac.dmg

      - name: Install NSIS (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install nsis -y --no-progress

      - name: Build (Windows, 含NSIS安装包)
        if: matrix.os == 'windows-latest'
        working-directory: client-gui
        shell: pwsh
        run: |
          $env:PATH += ';C:\Program Files (x86)\NSIS'
          wails build -platform windows/amd64 -nsis

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: octop-workbench-${{ matrix.os }}
          path: |
            client-gui/build/bin/*.zip
            client-gui/build/bin/*.exe
            client-gui/build/bin/*.app

      - name: Extract bilingual release notes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}  # tag名经env传入,不走shell插值,防注入
        run: |
          awk -v t="## [$TAG]" 'index($0,t)==1{f=1;next} f&&/^## \[/{exit} f' CHANGELOG.md > release_notes.md
          head -3 release_notes.md

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            client-gui/build/bin/*.zip
            client-gui/build/bin/*.dmg
            client-gui/build/bin/*installer*.exe
            client-gui/build/bin/octop-workbench.exe
